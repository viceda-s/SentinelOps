services:
  nginx:
    image: nginx:1.27-alpine
    container_name: sentinelops-nginx
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./health:/app/health:ro
      - ./reports:/app/reports:ro
    depends_on:
      - api
      - report-generator
    ports:
      - "8081:80"
    restart: unless-stopped

  api:
    build: ./docker/api
    container_name: sentinelops-api
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5001:5000"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: sentinelops-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      RESPONSE_ENGINE_DB_PASSWORD: ${RESPONSE_ENGINE_DB_PASSWORD}
      REPORT_GENERATOR_DB_PASSWORD: ${REPORT_GENERATOR_DB_PASSWORD}
      API_DB_PASSWORD: ${API_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: sentinelops-node-exporter
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: sentinelops-cadvisor
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    devices:
      - /dev/kmsg
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: sentinelops-prometheus
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/rules:/etc/prometheus/rules:ro
    ports:
      - "9090:9090"
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.33.1
    container_name: sentinelops-alertmanager
    volumes:
      - ./docker/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    container_name: sentinelops-grafana
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/provisioning/dashboards/json:ro
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  report-generator:
    build:
      context: .
      dockerfile: docker/report-generator/Dockerfile
    container_name: sentinelops-report-generator
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./reports:/app/reports
      - ./health:/app/health
      - ./diagnostics:/app/diagnostics:ro
    restart: unless-stopped

  webhook-handler:
    build:
      context: .
      dockerfile: docker/webhook-handler/Dockerfile
    container_name: sentinelops-webhook-handler
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5002:8000"
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
    container_name: sentinelops-worker
    init: true
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./diagnostics:/app/diagnostics
    restart: unless-stopped

  maintenance-monitor:
    build:
      context: .
      dockerfile: docker/maintenance-monitor/Dockerfile
    container_name: sentinelops-maintenance-monitor
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      ALERTMANAGER_URL: http://alertmanager:9093
      PYTHONFAULTHANDLER: "1"
    depends_on:
      postgres:
        condition: service_healthy
      alertmanager:
        condition: service_started
    restart: unless-stopped

  vault:
    image: hashicorp/vault:2.1.1
    container_name: sentinelops-vault
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "8200:8200"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "-q",
          "http://127.0.0.1:8200/v1/sys/health?standbyok=true",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  jenkins:
    image: jenkins/jenkins:2.568.3-slim
    container_name: sentinelops-jenkins
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
    restart: unless-stopped

  jenkins-agent:
    build:
      context: ./docker/jenkins-agent
      args:
        DOCKER_GID: ${DOCKER_GID}
    container_name: sentinelops-jenkins-agent
    environment:
      JENKINS_URL: http://jenkins:8080
      JENKINS_AGENT_NAME: docker-agent
      JENKINS_SECRET: ${JENKINS_AGENT_SECRET}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${JENKINS_AGENT_WORKDIR}:${JENKINS_AGENT_WORKDIR}
    depends_on:
      - jenkins
    restart: unless-stopped

  smee:
    build:
      context: ./docker/smee
    container_name: sentinelops-smee
    command:
      [
        "--url",
        "${SMEE_CHANNEL_URL}",
        "--target",
        "http://jenkins:8080/github-webhook/",
      ]
    depends_on:
      - jenkins
    restart: unless-stopped

volumes:
  postgres_data:
  jenkins_home:
