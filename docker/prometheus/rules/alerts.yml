groups:
  - name: sentinelops
    rules:
      - alert: DiskPressure
        expr: >-
          (
            node_filesystem_avail_bytes{fstype!~"tmpfs|erofs|overlay|squashfs", mountpoint!~"/oldroot|/run.*"}
            /
            node_filesystem_size_bytes{fstype!~"tmpfs|erofs|overlay|squashfs", mountpoint!~"/oldroot|/run.*"}
          ) * 100 < 10
        for: 2m
        labels:
          severity: warning
          playbook: disk_cleanup
        annotations:
          summary: "Low disk space on {{ $labels.instance }} ({{ $labels.mountpoint }})"
          description: "Free disk space has dropped below 10%."

      - alert: HighCPU
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
        for: 5m
        labels:
          severity: warning
          playbook: collect_diagnostics
        annotations:
          summary: "High CPU on {{ $labels.instance }}"
          description: "CPU usage has been above 90% for 5 minutes."

      - alert: HighErrorRate
        expr: rate(api_errors_total[2m]) / sum by (endpoint) (rate(api_requests_total[2m])) > 0.05
        for: 2m
        labels:
          severity: critical
          playbook: collect_diagnostics
        annotations:
          summary: "High error rate on {{ $labels.endpoint }}"
          description: "5xx error ratio has exceeded 5% for 2 minutes."

      - alert: HighLatency
        expr: histogram_quantile(0.95, sum by (le, endpoint) (rate(api_request_latency_seconds_bucket[5m]))) > 1
        for: 5m
        labels:
          severity: warning
          playbook: collect_diagnostics
        annotations:
          summary: "High latency on {{ $labels.endpoint }}"
          description: "95th percentile latency has exceeded 1 second for 5 minutes"

      - alert: HighMemory
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 5m
        labels:
          severity: warning
          playbook: collect_diagnostics
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"
          description: "Memory usage has been above 85% for 5 minutes."

      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
          playbook: restart_service
        annotations:
          summary: "{{ $labels.job }} is down"
          description: "{{ $labels.job }} has been unreachable for 1 minute"

      - alert: ResponseEngineDown
        expr: time() - sentinelops_worker_heartbeat_timestamp{job="worker"} > 30
        labels:
          severity: critical
          playbook: none
        annotations:
          summary: "Response engine worker heartbeat stale"
          description: "The response engine worker heartbeat has not advanced for more than 30 seconds."

      - alert: MaintenanceMonitorDown
        expr: time() - sentinelops_maintenance_heartbeat_timestamp{job="maintenance-monitor"} > 30
        labels:
          severity: critical
          playbook: restart_service
        annotations:
          summary: "Maintenance monitor heartbeat stale"
          description: "The maintenance monitor heartbeat has not advanced for more than 30 seconds."
