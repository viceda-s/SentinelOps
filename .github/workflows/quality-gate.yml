# Lightweight public CI backstop for SentinelOps.
# Jenkins (see Jenkinsfile) is the primary, required CI/CD pipeline covering
# the full gate: coverage, SonarQube Cloud quality gate, Trivy scan, E2E chaos.
# This workflow stays deliberately thin and always-on so the public repo shows
# a CI signal even when the local Jenkins controller/smee.io tunnel are down.
# See docs/adr/012-jenkins-primary-cicd-with-github-actions-backstop.md.

name: Quality Gate (Backstop)

on:
  workflow_dispatch:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: quality-backstop-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"

jobs:
  python-quality:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sentinelops_test
          POSTGRES_USER: sentinelops_test
          POSTGRES_PASSWORD: sentinelops_test_password
          RESPONSE_ENGINE_DB_PASSWORD: response_engine_test_password
          REPORT_GENERATOR_DB_PASSWORD: report_generator_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinelops_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - run: pip install -r requirements-dev.txt

      - name: load test environment configuration
        run: grep -v '^#' .env.test | grep -v '^$' >> "$GITHUB_ENV"

      - name: initialize and verify test database schema
        run: ./automation/scripts/init_test_db.sh

      - name: ruff lint
        run: ruff check .

      - name: ruff format check
        run: ruff format --check .

      - name: pytest suite
        run: pytest -m "not e2e"
