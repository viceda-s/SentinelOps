# Single authoritative quality workflow for SentinelOps.
# Runs static checks, configuration validation via bootstrap.sh, and
# isolated Python test suite execution against an ephemeral PostgreSQL service container.

name: Quality Gate

on:
  workflow_dispatch:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"

jobs:
  config-validation:
    name: Configuration & Static Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - run: pip install -r requirements-dev.txt

      - name: shellcheck scripts
        run: shellcheck automation/scripts/*.sh docker/postgres/init/007_create_roles.sh

      - name: verify script permissions
        run: |
          for f in automation/scripts/*.sh; do
            if [ ! -x "$f" ]; then
              echo "$f is not executable"
              echo "fix: git update-index --chmod=+x $f"
              exit 1
            fi
          done

      # bootstrap.sh --validate-only executes compose config, promtool (on docker/prometheus/rules/alerts.yml),
      # amtool (on docker/alertmanager/alertmanager.yml), CMDB validation, and runbook mapping checks.
      - name: validate deployment configuration
        run: |
          cp .env.example .env
          ./automation/scripts/bootstrap.sh --validate-only

      - name: verify readme script references
        run: |
          fail=0
          for s in $(grep -oE '\./[A-Za-z0-9_/.-]+\.sh' README.md | sort -u); do
            [ -f "$s" ] || { echo "readme references $s but it doesn't exist"; fail=1; }
          done
          exit $fail

  python-quality:
    name: Python Quality & Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sentinelops_test
          POSTGRES_USER: sentinelops_test
          POSTGRES_PASSWORD: sentinelops_test_password
          RESPONSE_ENGINE_DB_PASSWORD: response_engine_test_password
          REPORT_GENERATOR_DB_PASSWORD: report_generator_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinelops_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - run: pip install -r requirements-dev.txt

      - name: load test environment configuration
        run: grep -v '^#' .env.test | grep -v '^$' >> "$GITHUB_ENV"

      - name: initialize and verify test database schema
        run: ./automation/scripts/init_test_db.sh

      - name: ruff lint
        run: ruff check .

      - name: ruff format check
        run: ruff format --check .

      - name: pytest suite
        run: pytest

  e2e-chaos:
    name: E2E Chaos Pipeline Tests
    runs-on: ubuntu-latest
    needs: [config-validation, python-quality]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - run: pip install -r requirements-dev.txt

      - name: report runner disk state
        run: df -Pk . | awk 'NR==2 {printf "total_kb=%d avail_kb=%d free_pct=%.2f\n", $2, $4, $4*100/$2}'

      - name: bootstrap the compose stack against the test environment
        run: |
          cp .env.test .env
          ./automation/scripts/bootstrap.sh

      - name: DEBUG docker storage layout
        run: |
          docker info
          echo "--- df -h ---"
          df -h
          echo "--- building one 1024MB filler image ---"
          mkdir -p .chaos
          cat > .chaos/disk-fill.Dockerfile <<'DOCKERFILE'
          ARG BASE_IMAGE
          FROM ${BASE_IMAGE} AS filler-base
          ARG FILL_MB
          RUN dd if=/dev/zero of=/chaos-filler bs=1M count=${FILL_MB} 2>/dev/null

          FROM scratch
          COPY --from=filler-base /chaos-filler /chaos-filler
          DOCKERFILE
          df -Pk . | awk 'NR==2 {printf "before: avail_kb=%d\n", $4}'
          time docker build -q --build-arg FILL_MB=1024 --build-arg BASE_IMAGE=postgres:16-alpine -f .chaos/disk-fill.Dockerfile .chaos
          df -Pk . | awk 'NR==2 {printf "after: avail_kb=%d\n", $4}'
          docker system df
          rm -f .chaos/disk-fill.Dockerfile

      - name: run e2e chaos test suite
        run: pytest -m e2e

      - name: upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-chaos-diagnostics
          path: |
            diagnostics/
            .chaos/
          if-no-files-found: ignore

      - name: dump compose logs on failure
        if: failure()
        run: docker compose logs --no-color > compose-logs.txt

      - name: upload compose logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-chaos-compose-logs
          path: compose-logs.txt
          if-no-files-found: ignore

      - name: teardown stack
        if: always()
        run: docker compose down -v --remove-orphans
