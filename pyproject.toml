[project]
name = "sentinelops"
version = "1.3.0"

[tool.pytest.ini_options]
addopts = "-m 'not e2e'"
markers = [
    "e2e: End-to-end chaos pipeline tests requiring active Docker Compose stack",
    "chaos: Chaos fault injection tests",
]

[tool.coverage.run]
source = ["automation"]
omit = ["automation/scripts/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
