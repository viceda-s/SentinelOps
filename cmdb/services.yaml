services:
  api:
    container_name: sentinelops-api
    owner: backend-team
    escalation_contact: backend-oncall@email.local
    tier: prod
    criticality: high
    runbook: docs/runbooks/service-down.md
    verification:
      type: http
      url: http://api:5000/health
    playbooks:
      ServiceDown: restart_service
      ContainerRestartLoop: collect_diagnostics
      HighErrorRate: collect_diagnostics
      HighLatency: collect_diagnostics
      HighCPU: collect_diagnostics
      HighMemory: collect_diagnostics
    sla:
      response_minutes: 5
      resolution_minutes: 60
    dependencies:
      - postgres

  cadvisor:
    container_name: sentinelops-cadvisor
    owner: platform-team
    escalation_contact: platform-oncall@email.local
    tier: prod
    criticality: medium
    runbook: docs/runbooks/service-down.md
    verification:
      type: docker-health
    playbooks:
      ServiceDown: restart_service
    sla:
      response_minutes: 15
      resolution_minutes: 60

  nginx:
    container_name: sentinelops-nginx
    owner: platform-team
    escalation_contact: platform-oncall@email.local
    tier: prod
    criticality: medium
    runbook: docs/runbooks/service-down.md
    verification:
      type: running
    playbooks:
      ServiceDown: restart_service
      ContainerRestartLoop: collect_diagnostics
    sla:
      response_minutes: 10
      resolution_minutes: 60

  node-exporter:
    container_name: sentinelops-node-exporter
    owner: platform-team
    escalation_contact: platform-oncall@email.local
    tier: prod
    criticality: medium
    runbook: docs/runbooks/service-down.md
    verification:
      type: running
    playbooks:
      ServiceDown: restart_service
    sla:
      response_minutes: 15
      resolution_minutes: 60

  postgres:
    container_name: sentinelops-postgres
    owner: database-team
    escalation_contact: database-oncall@email.local
    tier: prod
    criticality: high
    runbook: docs/runbooks/service-down.md
    verification:
      type: docker-health
    playbooks:
      ServiceDown: restart_service
      ContainerRestartLoop: collect_diagnostics
      HighCPU: collect_diagnostics
      HighMemory: collect_diagnostics
      DiskPressure: disk_cleanup
    sla:
      response_minutes: 5
      resolution_minutes: 60

  webhook-handler:
    container_name: sentinelops-webhook-handler
    owner: platform-team
    escalation_contact: platform-oncall@email.local
    tier: prod
    criticality: high
    runbook: docs/runbooks/service-down.md
    verification:
      type: http
      url: http://webhook-handler:8000/metrics
    playbooks:
      ResponseEngineDown: none
    sla:
      response_minutes: 5
      resolution_minutes: 60

  worker:
    container_name: sentinelops-worker
    owner: platform-team
    escalation_contact: platform-oncall@email.local
    tier: prod
    criticality: high
    runbook: docs/runbooks/service-down.md
    verification:
      type: http
      url: http://worker:8000/metrics
    playbooks:
      ResponseEngineDown: none
    sla:
      response_minutes: 5
      resolution_minutes: 60

  maintenance-monitor:
    container_name: sentinelops-maintenance-monitor
    owner: platform-team
    escalation_contact: platform-oncall@email.local
    tier: prod
    criticality: high
    runbook: docs/runbooks/service-down.md
    verification:
      type: http
      url: http://maintenance-monitor:8000/metrics
    playbooks:
      MaintenanceMonitorDown: none
    sla:
      response_minutes: 5
      resolution_minutes: 60
